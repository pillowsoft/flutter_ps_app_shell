name: flutter_app_shell
description: A comprehensive Flutter application shell framework for rapid development with adaptive UI, service architecture, and state management.
version: 1.1.5
homepage: https://github.com/yourusername/flutter_app_shell
repository: https://github.com/yourusername/flutter_app_shell

environment:
  sdk: ^3.6.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Core dependencies
  flutter_hooks: ^0.21.3
  go_router: ^17.0.1
  get_it: ^9.2.0

  # State management
  signals: ^6.3.0
  signals_flutter: ^6.3.0

  # UI and styling
  google_fonts: ^6.3.3
  cupertino_icons: ^1.0.8
  awesome_flutter_extensions: ^2.0.1
  multi_split_view: ^3.6.1

  # Platform support
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0

  # Utilities
  collection: ^1.19.1
  intl: ^0.20.2
  logging: ^1.3.0
  nanoid: ^1.0.0
  easy_debounce: ^2.0.3
  path: ^1.9.1
  yaml: ^3.1.3

  # Database
  instantdb_flutter:
    git:
      url: https://github.com/pillowsoft/instantdb_flutter.git
      ref: v0.2.7

  # Environment configuration
  flutter_dotenv: ^6.0.0

  # Network
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # Authentication
  local_auth: ^3.0.0
  crypto: ^3.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
